# Server settings for the TPC-H experiments (rendered into $PGDATA/tpch.conf by setup.sh).
# Per-query knobs (work_mem, parallelism, ...) are set by the runner and recorded per run.

port = @PG_PORT@
unix_socket_directories = '@PGSOCK@'
listen_addresses = ''                   # unix socket only

# Memory: kept well below RAM (62 GiB) so cold runs really hit the disk at SF100.
shared_buffers = 1GB
work_mem = 64MB
maintenance_work_mem = 2GB              # faster PK builds after load

# Measurement hygiene
track_io_timing = on
jit = off                               # JIT compile time distorts the CPU model
max_parallel_workers_per_gather = 0     # single backend by default; parallel is an explicit variant
autovacuum = off                        # read-only workload; avoid background I/O during runs

# Bulk load: tables are created and loaded in fresh DBs, so WAL can be minimal.
wal_level = minimal
max_wal_senders = 0
max_wal_size = 8GB
